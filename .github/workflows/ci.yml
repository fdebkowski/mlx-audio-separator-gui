name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m py_compile app.py runner.py main_bundle.py bundle_fix_record.py
      - name: Syntax-check shell scripts
        run: bash -n build.sh setup.sh build_bundle.sh
