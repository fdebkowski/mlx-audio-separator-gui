name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m py_compile app.py runner.py model_catalog.py main_bundle.py bundle_fix_record.py
      - name: Install catalog config parser
        run: >-
          python -m pip install -c constraints-release.txt pyyaml torch==2.8.0
          'bs-roformer-infer @ git+https://github.com/openmirlab/bs-roformer-infer.git@95c8de7b0b091d00f064d694bf916a21866c32f5'
      - name: Syntax-check shell scripts
        run: bash -n build.sh setup.sh build_bundle.sh
      - name: Test model catalog and downloads
        run: python -m unittest discover -s tests -v
